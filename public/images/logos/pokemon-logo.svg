<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 112" fill="none">
  <defs>
    <linearGradient id="pkYellow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE64D"/>
      <stop offset="52%" stop-color="#FFCB05"/>
      <stop offset="100%" stop-color="#E5A800"/>
    </linearGradient>
    <filter id="pkShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#0B1942" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Stylized Pokéball emblem left -->
  <g transform="translate(14 18)" filter="url(#pkShadow)">
    <circle cx="38" cy="38" r="34" fill="#1D2B53"/>
    <path d="M6 38A32 32 0 0 1 70 38Z" fill="#EF3E36"/>
    <path d="M6 38A32 32 0 0 0 70 38Z" fill="#F8FAFC"/>
    <rect x="4" y="33.5" width="68" height="9" fill="#1D2B53"/>
    <circle cx="38" cy="38" r="12.5" fill="#1D2B53"/>
    <circle cx="38" cy="38" r="7.5" fill="#F8FAFC"/>
    <circle cx="38" cy="38" r="3.6" fill="#CBD5E1"/>
    <path d="M16 20A25 25 0 0 1 36 10" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Bold Pokémon wordmark (deep blue outer outline + classic yellow fill) -->
  <g filter="url(#pkShadow)">
    <text
      x="104"
      y="74"
      font-family="'Arial Black', 'Impact', 'Helvetica Neue', sans-serif"
      font-weight="900"
      font-size="48"
      letter-spacing="-1.5"
      fill="url(#pkYellow)"
      stroke="#2348A8"
      stroke-width="9"
      stroke-linejoin="round"
      paint-order="stroke fill"
    >Pokémon</text>
  </g>
</svg>
